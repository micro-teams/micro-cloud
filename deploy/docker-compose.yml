# MicroCloud deployment — stock images + bind-mounted build artifacts, no custom images.
#
#   nginx      the domain-independent gateway (SPA + /microcloud -> backend)
#   backend    this app's jar, run on a stock JRE image
#   newapi     the LLM relay/gateway (our fork micro-teams/new-api, pinned to a release)
#   postgres   MicroCloud's DB (schema "microcloud")
#
# Secrets come from .env (generate it with `bash gen-env.sh`). All state lives in ./app_data/ as
# plain host directories (no docker volumes) so it's visible and easy to back up. CI's package-zip
# step pins the backend base image (our eclipse-temurin+ssh) to its digest in the shipped compose;
# the stock images (postgres/nginx) and our newapi release are referenced by tag.

services:
  postgres:
    image: postgres:16.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./app_data/postgresql:/var/lib/postgresql/data
      # Runs once on first init: create the "microcloud" schema the backend owns (Hibernate then
      # fills its tables + sequences).
      - ./init/01-microcloud-schema.sql:/docker-entrypoint-initdb.d/01-microcloud-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The LLM relay/gateway: our fork micro-teams/new-api, built and published to GHCR from the
  # pinned release v1.0.0-rc.21 (Publish Docker image workflow → ghcr.io).
  newapi:
    image: ghcr.io/micro-teams/new-api:v1.0.0-rc.21
    restart: unless-stopped
    volumes:
      - ./app_data/newapi:/data
    healthcheck:
      # The newapi image ships wget, not curl.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    # Stock JRE + an ssh client (for init-machine.py) — our thin image, pinned to a digest by CI's
    # package-zip step. See deploy/backend-base/Dockerfile.
    image: ghcr.io/micro-teams/eclipse-temurin:21-jre
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["java", "-jar", "/app/backend.jar"]
    # The default json-file log dies with its container: a `docker compose up -d` on 2026-09-02
    # deleted the only record of what happened to machine 553. journald outlives the container.
    logging:
      driver: journald
    environment:
      # The backend derives absolute URLs from X-Forwarded-* (no domain baked in); ddl-auto=update
      # creates its tables in the "microcloud" schema on first boot. The pool is 20 rather than
      # Hikari's 10 because a provision in flight holds two connections (its own transaction plus
      # the event log's REQUIRES_NEW writes); set here and not in the defaults, since the test
      # suite runs several Spring contexts against one Postgres and 20 each exhausts it.
      SPRING_APPLICATION_JSON: >-
        {"spring.datasource.url":"jdbc:postgresql://postgres:5432/${POSTGRES_DB}",
        "spring.datasource.username":"${POSTGRES_USER}",
        "spring.datasource.password":"${POSTGRES_PASSWORD}",
        "spring.datasource.hikari.maximum-pool-size":20,
        "spring.jpa.hibernate.ddl-auto":"update",
        "application.jwt-secret":"${JWT_SECRET}",
        "microcloud.superadmin-password":"${SUPERADMIN_PASSWORD}",
        "microcloud.newapi.root-password":"${NEWAPI_ROOT_PASSWORD}",
        "microcloud.newapi.machine-base-url":"${NEWAPI_MACHINE_BASE_URL}",
        "microcloud.ccproxy.base-url":"${CCPROXY_BASE_URL}",
        "microcloud.ccproxy.tenant-secret":"${CCPROXY_TENANT_SECRET}"}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    volumes:
      - ./backend/backend.jar:/app/backend.jar:ro
      # Operator SSH keys for provisioning init (see deploy/README.md). gen-env.sh creates ./keys/.
      - ./keys:/keys:ro
      # The template images — the backend enumerates this dir to build its template catalog.
      - ./templates:/templates:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The host port your outer reverse-proxy points at (defaults to 80).
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
