spring.application.name=microcloud

# Default database configuration. These are generic local-dev/CI defaults, not real deployment
# values — real ones are passed via --spring.datasource.* / SPRING_APPLICATION_JSON at runtime,
# since whatever's baked in here at build time can't change afterwards.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Machine events are written in their own transaction (REQUIRES_NEW) while the provisioning
# transaction that emits them still holds its connection, so a provision in flight costs two
# connections. Hikari's default of 10 would stall event writes at ten concurrent provisions;
# 20 leaves room for that many plus the API.
spring.datasource.hikari.maximum-pool-size=20
# Off by default: echoing every statement floods prod logs and leaks query shapes.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
# MicroCloud owns the "microcloud" schema (tenants/customers/accounts/machines/api-keys/audit).
spring.jpa.properties.hibernate.default_schema=microcloud

# The authorization framework (org.rucca.cheese.auth) verifies JWTs signed with this secret. In a
# deployment it is injected at runtime; this is only a dev/CI placeholder.
application.jwt-secret=test-secret
# Reserved by the borrowed config kernel (org.rucca.cheese.common.config.ApplicationConfig). Unused
# by MicroCloud today but kept non-null so property binding succeeds.
application.legacy-url=
application.cors-origin=http://localhost:5173
application.warn-audit-failure=true

# Actuator health, used as the container healthcheck. Readiness only (UP once the app has fully
# started, which requires a working DB) — the aggregate /actuator/health would 503 forever on the
# unused redis/elasticsearch indicators inherited from the cheese lineage.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# spring.jpa.open-in-view stays enabled: disabling it makes JPA effectively not work in this setup.
spring.jpa.open-in-view=true

# MicroCloud super-admin password (dev/CI placeholder; injected at runtime in deployment).
microcloud.superadmin-password=change-me-in-deployment
