# Reference pct parameters for the Debian 13 LXC template MicroCloud clones.
# Not consumed automatically — build-template.sh embeds these; kept here as the documented default.

cores: 2
memory: 2048
swap: 512
rootfs_gb: 8
unprivileged: 1
features: nesting=1        # Docker inside the container (Claude Code + user workloads)

# Networking: MicroCloud assigns a private IP from its configured IpRange(s) at clone time
# (pct set <id> -net0 name=eth0,bridge=<bridge>,ip=<addr>/<mask>,gw=<gw>). Production uses
# 192.168.16.0/20, but MicroCloud supports multiple inclusive [start,end] ranges. No public SSH
# exposure: the machine is reachable on the shared private network only.
bridge: vmbr0
